name: Validate Offline Scripture Corpus
on:
  push:
    paths:
      - "tools/prepare_corpus.py"
      - "tools/import_etcbc_dss.py"
      - "tools/build_dss_book_index.py"
      - "tools/build_dss_passage_evidence.py"
      - "tools/build_dss_reconstructions.py"
      - "tools/import_codex_sinaiticus.py"
      - "tools/import_codex_vaticanus.py"
      - "tools/import_papyrus_46.py"
      - "tools/import_papyrus_52.py"
      - "tools/import_papyrus_66.py"
      - "tools/import_papyrus_75.py"
      - "tools/import_papyrus_72.py"
      - "tools/import_papyrus_77.py"
      - "tools/import_didache.py"
      - "tools/import_shepherd_of_hermas.py"
      - "tools/import_ignatius.py"
      - "tools/import_barnabas.py"
      - "tools/import_testament_of_abraham.py"
      - "tools/import_gospel_of_thomas.py"
      - "tools/import_enoch_greek.py"
      - "tools/import_enoch_geez.py"
      - "tools/import_ascension_isaiah.py"
      - "tools/build_john_witness_index.py"
      - "tools/import_2_baruch.py"
      - "tools/import_3_baruch.py"
      - "tools/import_twelve_patriarchs.py"
      - "tools/import_odes_of_solomon.py"
      - "tools/import_jubilees_geez.py"
      - "tools/validate_corpus.py"
      - "app/src/main/java/org/scripturesofgod/archive/MainActivity.java"
      - "app/src/main/assets/catalog/**"
      - ".github/workflows/validate-corpus.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and prepare licensed source texts
        run: python tools/prepare_corpus.py
      - name: Download featured Qumran-Digital transcription source pages
        run: python tools/download_qumran_digital_sources.py
      - name: Import offline Dead Sea Scrolls transcriptions
        run: python tools/import_etcbc_dss.py
      - name: Index every book and writing actually attested in imported DSS lines
        run: python tools/build_dss_book_index.py
      - name: Build line-level DSS passage evidence from curated fragment concordance
        run: python tools/build_dss_passage_evidence.py
      - name: Reconstruct Hebrew readings from DSS witnesses and fill aligned gaps from WLC
        run: python tools/build_dss_reconstructions.py
      - name: Import Codex Vaticanus manuscript transcription
        run: python tools/import_codex_vaticanus.py
      - name: Import Papyrus 46 manuscript transcription
        run: python tools/import_papyrus_46.py
      - name: Import Papyrus 52 manuscript transcription
        run: python tools/import_papyrus_52.py
      - name: Import Papyrus 66 manuscript transcription
        run: python tools/import_papyrus_66.py
      - name: Import Papyrus 75 manuscript transcription
        run: python tools/import_papyrus_75.py
      - name: Import Papyrus 72 composite codex transcription
        run: python tools/import_papyrus_72.py
      - name: Import Papyrus 77 manuscript transcription
        run: python tools/import_papyrus_77.py
      - name: Import Codex Sinaiticus manuscript transcription
        run: python tools/import_codex_sinaiticus.py
      - name: Build verse-level John manuscript comparison index
        run: python tools/build_john_witness_index.py
      - name: Import Greek Didache reference text
        run: python tools/import_didache.py
      - name: Import Greek Shepherd of Hermas reference text
        run: python tools/import_shepherd_of_hermas.py
      - name: Import seven Greek letters of Ignatius
        run: python tools/import_ignatius.py
      - name: Import Greek Epistle of Barnabas
        run: python tools/import_barnabas.py
      - name: Import Greek Testament of Abraham recensions
        run: python tools/import_testament_of_abraham.py
      - name: Import Coptic Gospel of Thomas manuscript text
        run: python tools/import_gospel_of_thomas.py
      - name: Import Greek 1 Enoch fragment edition
        run: python tools/import_enoch_greek.py
      - name: Import complete EOTC Ge'ez 1 Enoch edition
        run: python tools/import_enoch_geez.py
      - name: Import Ge'ez Jubilees editions
        run: python tools/import_jubilees_geez.py
      - name: Import Syriac Odes of Solomon text
        run: python tools/import_odes_of_solomon.py
      - name: Import Greek Twelve Patriarchs provisional base text
        run: python tools/import_twelve_patriarchs.py
      - name: Import Greek 3 Baruch critical edition
        run: python tools/import_3_baruch.py
      - name: Import Syriac 2 Baruch text
        run: python tools/import_2_baruch.py
      - name: Import Ge'ez Ascension of Isaiah text
        run: python tools/import_ascension_isaiah.py
      - name: Validate imported papyrus page indexes and text records
        run: python tools/validate_corpus.py papyri
      - name: Validate base Hebrew and Greek corpus
        run: python tools/validate_corpus.py base
      - name: Validate complete Apocrypha texts
        run: python tools/validate_corpus.py apocrypha
      - name: Validate Dead Sea Scrolls catalogue and concordance
        run: python tools/validate_corpus.py dss
      - name: Validate generated Hebrew reconstruction
        run: python tools/validate_corpus.py reconstruction
      - name: Validate John witness index and complete reading sequence
        run: python tools/validate_corpus.py john
      - name: Validate Android book navigation and search
        run: python tools/validate_corpus.py android
      - name: Confirm validation did not build an APK
        run: echo "Corpus validation complete; no APK was built or uploaded."
