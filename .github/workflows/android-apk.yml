name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare offline Scripture corpus
        run: python3 tools/prepare_corpus.py
      - name: Import offline Dead Sea Scrolls transcriptions
        run: python3 tools/import_etcbc_dss.py
      - name: Validate complete corpus before any APK build
        run: |
          python3 tools/validate_corpus.py base
          python3 tools/validate_corpus.py apocrypha
          python3 tools/validate_corpus.py dss
          python3 tools/validate_corpus.py android
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: the-scriptures-of-god-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
