name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare offline Scripture corpus
        run: python3 tools/prepare_corpus.py
      - name: Import Kahana Hebrew Sirach edition with editorial markers preserved
        run: python3 tools/import_sirach_kahana.py
      - name: Prepare CACCHT Samaritan Pentateuch source
        run: |
          python3 -m pip install --disable-pip-version-check text-fabric
          git clone --depth 1 https://github.com/DT-UCPH/sp.git build/samaritan-sp
          test -f build/samaritan-sp/tf/7.4.1/otype.tf
      - name: Import Samaritan Pentateuch as a separate witness
        run: python3 tools/import_samaritan_pentateuch.py
      - name: Prepare pinned ETCBC Syriac Peshitta source
        run: |
          git clone https://github.com/ETCBC/syriac.git build/syriac
          git -C build/syriac checkout 0b6ded2b369c7d81589a98c92325290e24b20af6
          test -f build/syriac/tf/0.92/otype.tf
      - name: Import Syriac Peshitta Ben Sira as a separate versional witness
        run: python3 tools/import_sirach_syriac.py
      - name: Download featured Qumran-Digital transcription source pages
        run: python3 tools/download_qumran_digital_sources.py
      - name: Import offline Dead Sea Scrolls transcriptions
        run: python3 tools/import_etcbc_dss.py
      - name: Extract direct 2Q18 Sirach fragment lines from QDR
        run: python3 tools/build_sirach_qdr_evidence.py
      - name: Build verse-aligned Sirach Hebrew restoration and version comparison layer
        run: python3 tools/build_sirach_reconstruction.py
      - name: Extract direct Sirach 51 lines preserved in the 11Q5 Psalms Scroll
        run: python3 tools/build_sirach_11q5_evidence.py
      - name: Index every book and writing actually attested in imported DSS lines
        run: python3 tools/build_dss_book_index.py
      - name: Build inventory of all imported DSS scroll witnesses
        run: python3 tools/build_dss_witness_inventory.py
      - name: Build line-level DSS passage evidence from curated fragment concordance
        run: python3 tools/build_dss_passage_evidence.py
      - name: Reconstruct Hebrew readings from DSS witnesses and fill aligned gaps from WLC
        run: python3 tools/build_dss_reconstructions.py
      - name: Import Codex Vaticanus manuscript transcription
        run: python3 tools/import_codex_vaticanus.py
      - name: Import Papyrus 46 manuscript transcription
        run: python3 tools/import_papyrus_46.py
      - name: Import Papyrus 52 manuscript transcription
        run: python3 tools/import_papyrus_52.py
      - name: Import Papyrus 66 manuscript transcription
        run: python3 tools/import_papyrus_66.py
      - name: Import Papyrus 75 manuscript transcription
        run: python3 tools/import_papyrus_75.py
      - name: Import Papyrus 72 composite codex transcription
        run: python3 tools/import_papyrus_72.py
      - name: Import Papyrus 77 manuscript transcription
        run: python3 tools/import_papyrus_77.py
      - name: Import Codex Sinaiticus manuscript transcription
        run: python3 tools/import_codex_sinaiticus.py
      - name: Build verse-level John manuscript comparison index
        run: python3 tools/build_john_witness_index.py
      - name: Import Greek Didache reference text
        run: python3 tools/import_didache.py
      - name: Import Greek Shepherd of Hermas reference text
        run: python3 tools/import_shepherd_of_hermas.py
      - name: Import seven Greek letters of Ignatius
        run: python3 tools/import_ignatius.py
      - name: Import Greek Epistle of Barnabas
        run: python3 tools/import_barnabas.py
      - name: Import Greek Testament of Abraham recensions
        run: python3 tools/import_testament_of_abraham.py
      - name: Import Coptic Gospel of Thomas manuscript text
        run: python3 tools/import_gospel_of_thomas.py
      - name: Import Greek 1 Enoch fragment edition
        run: python3 tools/import_enoch_greek.py
      - name: Import complete EOTC Ge'ez 1 Enoch edition
        run: python3 tools/import_enoch_geez.py
      - name: Import Ge'ez Jubilees editions
        run: python3 tools/import_jubilees_geez.py
      - name: Import Syriac Odes of Solomon text
        run: python3 tools/import_odes_of_solomon.py
      - name: Import Greek Twelve Patriarchs provisional base text
        run: python3 tools/import_twelve_patriarchs.py
      - name: Import Greek 3 Baruch critical edition
        run: python3 tools/import_3_baruch.py
      - name: Import Syriac 2 Baruch text
        run: python3 tools/import_2_baruch.py
      - name: Import Ge'ez Ascension of Isaiah text
        run: python3 tools/import_ascension_isaiah.py
      - name: Validate complete corpus before any APK build
        run: |
          python3 tools/validate_corpus.py base
          python3 tools/validate_corpus.py samaritan
          python3 tools/validate_corpus.py apocrypha
          python3 tools/validate_corpus.py dss
          python3 tools/validate_corpus.py reconstruction
          python3 tools/validate_corpus.py papyri
          python3 tools/validate_corpus.py john
          python3 tools/validate_corpus.py android
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: the-scriptures-of-god-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
